<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - FormatShift</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root[data-theme="light"] {
            --bg-color: #f1f5f9;
            --card-bg: rgba(255, 255, 255, 0.85);
            --primary: #3b82f6;
            --text-main: #0f172a;
            --text-muted: #475569;
            --glass-border: rgba(0, 0, 0, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; padding: 40px 20px; }
        .container {
            background: var(--card-bg); border: 1px solid var(--glass-border); border-radius: 24px;
            padding: 40px; max-width: 800px; margin: 0 auto; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        h1 { color: var(--primary); margin-bottom: 16px; }
        p { color: var(--text-muted); margin-bottom: 24px; font-size: 1.1rem; }
        a { color: var(--primary); text-decoration: none; font-weight: bold; }
        a:hover { text-decoration: underline; }
        .back-btn { display: inline-block; margin-bottom: 24px; font-weight: 600; text-align: left; width: 100%; }
        .email-box {
            background: rgba(59, 130, 246, 0.1); padding: 24px; border-radius: 12px;
            border: 1px solid var(--primary); display: inline-block;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-btn">&larr; Back to Home</a>
        <h1>Contact Us</h1>
        
        <p>If you have any questions, bug reports, or feature requests regarding FormatShift, we would love to hear from you!</p>
        
        <div class="email-box">
            <p style="margin-bottom: 0;">Email us directly at:</p>
            <a href="mailto:support@formatshift-web.vercel.app" style="font-size: 1.25rem;">support@formatshift-web.vercel.app</a>
        </div>
    </div>
</body>
</html>
